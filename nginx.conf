http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;

    keepalive_timeout 65;

    server {
        listen 9999;
        server_name myApp;

        location / {
            root dist;
            try_files $uri $uri/ /index.html;
            index index.html index.htm;
        }

        location /prod-api/ {
            #ip为后端服务地址
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://localhost:19999/;
            proxy_cookie_path /prod-api/ /;

            proxy_cache off; #关闭缓存
            proxy_buffering off; #关闭代理缓冲
            chunked_transfer_encoding on; #开启分块传输编码
            tcp_nopush on; #禁用Nagle
            tcp_nodelay on; #禁用ack延迟算法
            keepalive_timeout 300; #增加keepalive超时时间
            client_max_body_size 200m;
            client_body_buffer_size 800M;
        }

        location /tduck-api/ {
            #ip为后端服务地址
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://localhost:19999/;
            proxy_cookie_path /prod-api/ /;

            proxy_cache off; #关闭缓存
            proxy_buffering off; #关闭代理缓冲
            chunked_transfer_encoding on; #开启分块传输编码
            tcp_nopush on; #禁用Nagle
            tcp_nodelay on; #禁用ack延迟算法
            keepalive_timeout 300; #增加keepalive超时时间
            client_max_body_size 200m;
            client_body_buffer_size 800M;
        }

        location /sso-prod-api/ {
            #ip为后端服务地址
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://localhost:19999/;
            proxy_cookie_path /sso-prod-api/ /;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }

    # AI模型
    server {
        listen 12306;
        server_name localhost;

        location / {
            proxy_pass http://172.16.200.113:50000; # 后端 WebSocket 服务器地址
            proxy_http_version 1.1; # 必须使用 HTTP/1.1
            proxy_set_header Upgrade $http_upgrade; # 升级协议为 WebSocket
            proxy_set_header Connection "Upgrade"; # 设置连接为 Upgrade
            proxy_set_header Host $host; # 传递主机头
            proxy_set_header X-Real-IP $remote_addr; # 传递客户端真实 IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 传递客户端 IP 列表
            proxy_set_header X-Forwarded-Proto $scheme; # 传递协议（http 或 https）
        }
    }
}
